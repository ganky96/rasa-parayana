name: Hugo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.150.1"
          extended: true
      - name: Build
        run: hugo --minify --gc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify Discord of new posts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NEW_POSTS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/post/*.md' || true)
          if [ -z "$NEW_POSTS" ]; then
            echo "No new posts"
            exit 0
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi

          for file in $NEW_POSTS; do
            if grep -qE 'draft\s*=\s*true' "$file"; then
              continue
            fi

            TITLE=$(grep -m1 -E '^title\s*=' "$file" | sed -E 's/^title\s*=\s*"?(.*?)"?$/\1/')
            SLUG=$(basename "$file" .md)
            URL="https://rasa-parayana.art/post/${SLUG}/"

            curl -fsS -H "Content-Type: application/json" \
              -d "{\"content\": \"New post: **${TITLE}**\\n${URL}\"}" \
              "$DISCORD_WEBHOOK_URL"
          done
